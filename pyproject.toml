[project]
name = "clearway"
version = "0.1.0"
description = "Multimodal trade-document clearance copilot"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12.0",
    "pillow>=12.3.0",
    "websockets>=13.0",
]

# Heavy ML stack, needed only to actually index pages. Kept out of the
# default install so CI stays a ~10s job:  uv sync --extra retrieval
[project.optional-dependencies]
retrieval = ["colpali-engine>=0.3", "torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearway"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
