name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run ruff format --check .
      - name: test
        run: uv run pytest -q
